<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login or Signup | FlashFit</title>
  <meta name="description"
    content="Login or create your FlashFit account to save addresses, orders, interests, and reviews." />
  <meta name="theme-color" content="#ff7a00" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="author" content="FlashFit" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="shortcut icon" href="ft.png" type="image/png">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YXMT95C1Z5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-YXMT95C1Z5');
  </script>
  <style>
    :root {
      --brand: #ff7a00;
      --text: #1f1f1f;
      --muted: #5f6677;
      --card: #fff;
      --bg: #f6f8fc;
      --shadow: 0 16px 35px rgba(16, 24, 40, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Outfit", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 8% -10%, #fff2e3 0%, var(--bg) 40%, var(--bg) 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .auth-card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid #eceff5;
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .brand {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .brand img {
      width: 110px;
      height: 54px;
      object-fit: contain;
      display: block;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: 1.9rem;
    }

    p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.65;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .mode-btn,
    .submit-btn,
    .secondary-link {
      border-radius: 8px;
      padding: 12px;
      font: inherit;
      font-weight: 700;
      text-align: center;
    }

    .mode-btn {
      border: 1px solid #ffd9b3;
      background: #fff7ef;
      color: #8c4600;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .form {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field input {
      width: 100%;
      border: 1px solid #dce2ef;
      border-radius: 8px;
      padding: 11px 12px;
      font: inherit;
    }

    .submit-btn {
      border: 0;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
    }

    .secondary-link {
      display: block;
      text-decoration: none;
      color: #8c4600;
      background: #fff5ea;
      border: 1px solid #ffd8b0;
      margin-top: 12px;
    }

    .msg {
      min-height: 20px;
      margin-top: 8px;
      color: #1d7d34;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <section class="auth-card">
    <a class="brand" href="index.html" aria-label="FlashFit Home"><img src="50x100logo.png" alt="FlashFit Logo" /></a>
    <h1 id="authTitle">Login to FlashFit</h1>
    <p id="authSubtitle">Use your account to save address, orders, interests, and reviews.</p>

    <div class="mode-switch">
      <button id="loginModeBtn" class="mode-btn active" type="button">Login</button>
      <button id="signupModeBtn" class="mode-btn" type="button">Signup</button>
    </div>

    <form id="authForm" class="form">
      <div id="nameField" class="field hidden">
        <label for="fullName">Full Name</label>
        <input id="fullName" type="text" placeholder="Enter full name" />
      </div>
      <div id="mobileField" class="field hidden">
        <label for="mobile">Mobile</label>
        <input id="mobile" type="tel" maxlength="10" inputmode="numeric" placeholder="10-digit mobile number" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter email address" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" required />
      </div>
      <button id="submitBtn" class="submit-btn" type="submit">Login</button>
    </form>

    <p id="authMsg" class="msg"></p>
    <a class="secondary-link" id="backLink" href="index.html">Back to Home</a>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="notification-config.js"></script>
  <script src="notification-service.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const nextPath = params.get("next") || "profile";
    const loginModeBtn = document.getElementById("loginModeBtn");
    const signupModeBtn = document.getElementById("signupModeBtn");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const authForm = document.getElementById("authForm");
    const submitBtn = document.getElementById("submitBtn");
    const authMsg = document.getElementById("authMsg");
    const nameField = document.getElementById("nameField");
    const mobileField = document.getElementById("mobileField");
    const fullNameInput = document.getElementById("fullName");
    const mobileInput = document.getElementById("mobile");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    let mode = "login";

    function setMessage(text, isError) {
      authMsg.style.color = isError ? "#c53b2f" : "#1d7d34";
      authMsg.textContent = text;
    }

    function syncMode(nextMode) {
      mode = nextMode;
      const isSignup = mode === "signup";
      loginModeBtn.classList.toggle("active", !isSignup);
      signupModeBtn.classList.toggle("active", isSignup);
      nameField.classList.toggle("hidden", !isSignup);
      mobileField.classList.toggle("hidden", !isSignup);
      authTitle.textContent = isSignup ? "Create your FlashFit account" : "Login to FlashFit";
      authSubtitle.textContent = isSignup
        ? "Save address, orders, interests, and reviews with your account."
        : "Use your account to access saved profile and order history.";
      submitBtn.textContent = isSignup ? "Create Account" : "Login";
      setMessage("", false);
    }

    function goNext() {
      const path = nextPath.endsWith(".html") ? nextPath : `${nextPath}.html`;
      window.location.href = path;
    }

    loginModeBtn.addEventListener("click", () => syncMode("login"));
    signupModeBtn.addEventListener("click", () => syncMode("signup"));

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        setMessage("Email and password are required.", true);
        return;
      }

      if (mode === "signup") {
        const fullName = fullNameInput.value.trim();
        const mobile = mobileInput.value.trim();
        if (!fullName) {
          setMessage("Full name is required for signup.", true);
          return;
        }
        if (mobile && !/^\d{10}$/.test(mobile)) {
          setMessage("Enter a valid 10-digit mobile number.", true);
          return;
        }

        const result = await window.flashfitDB.signUp(email, password, {
          full_name: fullName,
          mobile
        });

        if (!result.ok) {
          setMessage(result.error || "Signup failed.", true);
          return;
        }

        await window.flashfitDB.saveUserProfile({
          fullName,
          email,
          mobile,
          defaultPincode: localStorage.getItem("flashfitPincode") || ""
        });

        if (window.flashfitNotifications) {
          await window.flashfitNotifications.create("new_user_registration", {
            title: `New User: ${fullName}`,
            body: `${fullName} registered with ${email}.`,
            userId: result.data && result.data.user ? result.data.user.id : null,
            entityType: "user_profiles",
            entityId: result.data && result.data.user ? result.data.user.id : email,
            metadata: { email, mobile }
          });
        }

        if (result.data && result.data.session) {
          goNext();
          return;
        }

        setMessage("Signup complete. If email verification is enabled, verify your email and then login.", false);
        syncMode("login");
        return;
      }

      const result = await window.flashfitDB.signIn(email, password);
      if (!result.ok) {
        setMessage(result.error || "Login failed.", true);
        return;
      }
      goNext();
    });

    (async () => {
      const user = await window.flashfitDB.getCurrentUser();
      if (user) goNext();
    })();
  </script>
</body>

</html>
