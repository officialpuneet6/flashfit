<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Failed | FlashFit</title>
  <meta name="description" content="FlashFit transaction failed page with clear recovery steps and support details." />
  <meta name="theme-color" content="#DFF24B" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="author" content="FlashFit" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="shortcut icon" href="ft.png" type="image/png">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YXMT95C1Z5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-YXMT95C1Z5');
  </script>
  <style>
    :root {
      --brand: #DFF24B;
      --brand-light: #ECF2BB;
      --ink: #101828;
      --muted: #667085;
      --danger: #d92d20;
      --danger-light: #fef3f2;
    }

    body {
      margin: 0;
      font-family: "Outfit", sans-serif;
      background: #f9fafb;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .icon-box {
      width: 80px;
      height: 80px;
      background: var(--danger-light);
      color: var(--danger);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 24px;
    }

    .brand {
      display: block;
      margin-bottom: 32px;
    }

    .brand img {
      height: 40px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--ink);
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.1rem;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .failed-tag {
      display: inline-block;
      color: var(--danger);
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .reason {
      padding: 16px;
      border-radius: 12px;
      background: #fdf2f2;
      border: 1px solid #fecdca;
      color: #b42318;
      font-size: 0.9rem;
      margin-bottom: 32px;
      word-break: break-all;
      text-align: left;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      text-decoration: none;
      border-radius: 12px;
      padding: 16px;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary {
      background: var(--brand);
      color: #fff;
    }

    .primary:hover {
      background: #e66e00;
      transform: translateY(-1px);
    }

    .secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid #d0d5dd;
    }

    .secondary:hover {
      background: #f9fafb;
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <a class="brand" href="index.html"><img src="50x100logo.png" alt="FlashFit" /></a>
    <div class="icon-box">
      <i class="fa-solid fa-circle-xmark"></i>
    </div>
    <div class="failed-tag">Transaction Failed</div>
    <h1>Payment could not be completed</h1>
    <p id="failureCopy" class="subtitle">Something went wrong while processing your payment. Your orders have not been
      placed yet.</p>
    <div id="reasonBox" class="reason">User order sync failed: new row violates row-level security policy for table
      "user_orders"</div>
    <div class="actions">
      <a class="btn primary" href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Return to Cart</a>
      <a class="btn secondary" href="contact-us.html"><i class="fa-solid fa-headset"></i> Contact Support</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="notification-config.js"></script>
  <script src="notification-service.js"></script>
  <script>
    const reasonBox = document.getElementById("reasonBox");
    const failureCopy = document.getElementById("failureCopy");
    const PAYMENT_SESSION_KEY = "flashfitPendingPayment";
    const reason = sessionStorage.getItem("flashfitPaymentMessage");
    if (reason) {
      reasonBox.textContent = reason;
      sessionStorage.removeItem("flashfitPaymentMessage");
    }

    (async () => {
      let pending = null;
      try {
        pending = JSON.parse(sessionStorage.getItem(PAYMENT_SESSION_KEY) || "null");
      } catch (_) {
        pending = null;
      }
      if (!pending || (pending.paymentMode !== "PAYU" && pending.paymentMode !== "UPI")) return;

      const flags = await window.flashfitDB?.getSecurityFeatureFlags?.() || {};
      if (flags.secure_payu_v1 && pending.paymentIntentId) {
        const payment = await window.flashfitDB?.getSecurePaymentStatus?.(pending.paymentIntentId);
        failureCopy.textContent = payment?.status === "paid"
          ? "Payment has been verified securely. Please check My Orders."
          : payment?.status === "failed"
            ? "Payment was not completed. Please return to My Orders or try again."
            : "Payment status is being verified securely. Please check My Orders shortly.";
        sessionStorage.removeItem(PAYMENT_SESSION_KEY);
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const status = (params.get("status") || "").toLowerCase();
      const txnid = params.get("txnid") || pending.txnid || "";
      const client = window.flashfitDB && window.flashfitDB.getSupabaseClient ? window.flashfitDB.getSupabaseClient() : null;

      if (client && pending.orderNumbers && pending.orderNumbers.length && (status === "failure" || !status)) {
        await client
          .from("seller_orders")
          .update({
            payment_status: "failed",
            payment_reference: txnid || "PAYU_FAILED"
          })
          .in("order_number", pending.orderNumbers);
        if (window.flashfitNotifications) {
          await Promise.allSettled(pending.orderNumbers.map((orderNumber) => window.flashfitNotifications.create("payment_failure", {
            title: `Payment Failed ${orderNumber}`,
            body: `${pending.customerName || "Customer"} payment failed for order ${orderNumber}.`,
            priority: "high",
            orderNumber,
            userId: pending.userId || null,
            entityType: "seller_orders",
            entityId: orderNumber,
            metadata: {
              payment_mode: pending.paymentMode || "PAYU",
              txnid
            }
          })));
        }
        failureCopy.textContent = "PayU payment was not completed. You can return to cart and try again.";
      }
      sessionStorage.removeItem(PAYMENT_SESSION_KEY);
    })();
  </script>
</body>

</html>
